name: Update vacatures data

concurrency:
  group: update-vacatures-data
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "apps/vacatures/bronnen/vacatures_*.xlsx"
      - "apps/vacatures/scripts/process_data.py"
      - ".github/workflows/update-vacatures-data.yml"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: vacatures
      APP_ROOT: apps/vacatures
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Refresh vacatures data
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify generated outputs
        run: |
          set -euo pipefail
          for f in \
            metadata.json \
            vacatures.csv \
            totals.csv \
            totals.json \
            monthly_totals.csv \
            monthly_totals.json \
            monthly_by_study.csv \
            monthly_by_study.json \
            received_monthly_hierarchy_series.csv \
            received_monthly_hierarchy_series.json \
            received_hierarchy_options.json \
            open_monthly.csv \
            open_monthly_totals.csv \
            open_monthly_totals.json \
            open_monthly_hierarchy_series.csv \
            open_monthly_hierarchy_series.json \
            open_hierarchy_options.json \
            groups.csv \
            groups_latest.json \
            beroepsgroepen.csv \
            beroepsgroepen_latest.json \
            latest_occupations.csv \
            occupations_latest.json \
            occupation_series.csv \
            occupation_series.json \
            occupation_options.json \
            hierarchy_series.csv \
            hierarchy_series.json \
            hierarchy_options.json
          do
            test -f "${APP_ROOT}/public/data/${f}" || { echo "Missing ${f}"; exit 1; }
          done

      - name: Validate source classification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          metadata = json.loads(Path("apps/vacatures/public/data/metadata.json").read_text())
          source_count = len(list(Path("apps/vacatures/bronnen").glob("vacatures_eoy_since_2011_all*.xlsx")))
          classified_count = (
              len(metadata["monthly_source_files"])
              + len(metadata["received_monthly_occupation_source_files"])
              + len(metadata["open_monthly_source_files"])
          )
          if source_count != classified_count:
              raise SystemExit(
                  f"Classified {classified_count} monthly source files, expected {source_count}"
              )
          if metadata["received_monthly_occupation_records"] <= 0:
              raise SystemExit("No received monthly occupation records generated")
          if metadata["open_monthly_records"] <= 0:
              raise SystemExit("No open monthly occupation records generated")
          print(
              "Classified monthly source files:",
              {
                  "received_study": len(metadata["monthly_source_files"]),
                  "received_occupation": len(metadata["received_monthly_occupation_source_files"]),
                  "open_occupation": len(metadata["open_monthly_source_files"]),
              },
          )
          PY

      - name: Sync visible metadata
        run: python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"

      - name: Commit and push changes
        id: commit_changes
        env:
          PUSH_TOKEN: ${{ secrets.DATA_UPDATE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_ROOT}/public/data/"
          git add "${APP_ROOT}/src/app/page.tsx"

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update vacatures data (auto)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git push origin HEAD:main; then
              echo "changed=true" >> "${GITHUB_OUTPUT}"
            else
              echo "::warning::Could not push generated data. Fix repository token access or set DATA_UPDATE_TOKEN."
              echo "changed=false" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
