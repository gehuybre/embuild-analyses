name: Update vergunningen-goedkeuringen data

concurrency:
  group: update-vergunningen-goedkeuringen-data
  cancel-in-progress: true

on:
  schedule:
    # Reduced to a single monthly automated run to limit Actions storage churn.
    # Additional release-day refreshes can be triggered manually via workflow_dispatch.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: vergunningen-goedkeuringen
      APP_ROOT: apps/vergunningen-goedkeuringen
      INPUT_URL: https://statbel.fgov.be/sites/default/files/files/opendata/Building%20permits/TF_BUILDING_PERMITS.zip
      META_FILE: apps/vergunningen-goedkeuringen/data/.remote_metadata.json
      PUBLICATION_PAGE_URL: https://statbel.fgov.be/nl/themas/bouwen-wonen/bouwvergunningen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas requests

      - name: Check remote metadata
        id: check_remote
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Manual dispatch — forcing fresh download."
            exit 0
          fi

          mkdir -p "$(dirname "${META_FILE}")"
          headers="$(curl -fsSLI --retry 3 --retry-delay 5 "${INPUT_URL}" || true)"
          export REMOTE_ETAG="$(printf '%s\n' "${headers}" | awk -F': ' 'tolower($1)=="etag" {print $2}' | tail -n1 | tr -d '\r"')"
          export REMOTE_LASTMOD="$(printf '%s\n' "${headers}" | awk -F': ' 'tolower($1)=="last-modified" {print substr($0,index($0,$2)) }' | tail -n1 | tr -d '\r')"

          set +e
          python scripts/check_remote_metadata.py
          rc=$?
          set -e

          if [ "${rc}" -eq 2 ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No remote change detected; skipping."
            exit 0
          fi

          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then
            exit "${rc}"
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Download and process data
        if: steps.check_remote.outputs.changed == 'true'
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify generated outputs
        if: steps.check_remote.outputs.changed == 'true'
        run: |
          set -euo pipefail
          data_dir="${APP_ROOT}/public/data"

          for f in data_quarterly.json data_monthly.json municipalities.json yearly_index.json municipality_index.json; do
            test -f "${data_dir}/${f}" || { echo "Missing: ${data_dir}/${f}"; exit 1; }
          done

          test -n "$(find "${data_dir}/yearly" -mindepth 1 -type f -print -quit)" || { echo "No yearly files"; exit 1; }
          test -n "$(find "${data_dir}/municipality" -mindepth 1 -type f -print -quit)" || { echo "No municipality files"; exit 1; }
          echo "✓ All outputs verified"

      - name: Update source publication date
        if: steps.check_remote.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/update_publication_date.py "${ANALYSIS_SLUG}" "${PUBLICATION_PAGE_URL}"
          python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"
          python scripts/update_vergunningen_goedkeuringen_content.py

      - name: Commit and push
        id: commit_changes
        if: steps.check_remote.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage metadata, visible page copy, and generated data files
          git add "${APP_ROOT}/data/.remote_metadata.json"
          git add "${APP_ROOT}/public/data/"

          if [ -f "${APP_ROOT}/content.mdx" ]; then
            git add "${APP_ROOT}/content.mdx"
          fi

          if [ -f "${APP_ROOT}/src/app/page.tsx" ]; then
            git add "${APP_ROOT}/src/app/page.tsx"
          fi

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update vergunningen-goedkeuringen data (auto)"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
