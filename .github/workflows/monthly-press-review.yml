name: Monthly press review (keyword)

# Discovers new press releases from emv-pers, applies keyword rules from
# press-blog-profiles.json to assess relevance per app, and opens a PR with
# proposed additions to press-reviewed-links.json for human review before merge.

concurrency:
  group: monthly-press-review
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 8 2 * *"  # 2nd of each month at 08:00 UTC (after existing regeneration run)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analyses repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.EMV_PERS_REPO_TOKEN }}" ]; then
            echo "::error::Missing secret: EMV_PERS_REPO_TOKEN"
            exit 1
          fi

      - name: Checkout emv-pers
        uses: actions/checkout@v4
        with:
          repository: gehuybre/emv-pers
          path: .cache/emv-pers
          token: ${{ secrets.EMV_PERS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      # The press-review-state.json tracks rejected articles so they are not
      # re-queued on the next run. It is not committed to git, so we persist
      # it via the Actions cache (restored before the queue build, saved after apply).
      - name: Restore review state cache
        uses: actions/cache@v4
        with:
          path: .cache/press-review-state.json
          key: press-review-state-v1-${{ github.run_id }}
          restore-keys: |
            press-review-state-v1-

      - name: Build review queue
        run: |
          set -euo pipefail
          python scripts/build_press_review_queue.py \
            --source-file .cache/emv-pers/press.ndjson \
            --max-items 30 \
            --top-k 4 \
            --min-score 5 \
            --verbose 2>&1

          items="$(python - <<'PY'
          import json, pathlib
          q = json.loads(pathlib.Path(".cache/press-review-queue.json").read_text())
          print(len(q.get("items", [])))
          PY
          )"
          echo "Queue size: ${items} item(s)"
          echo "QUEUE_SIZE=${items}" >> "${GITHUB_ENV}"

      - name: Keyword relevance review
        if: env.QUEUE_SIZE != '0'
        run: |
          set -euo pipefail
          python scripts/keyword_press_review.py \
            --verbose 2>&1

      - name: Apply review decisions
        if: env.QUEUE_SIZE != '0'
        run: |
          set -euo pipefail
          python scripts/apply_press_review_queue.py \
            --source-file .cache/emv-pers/press.ndjson \
            --verbose 2>&1

      - name: Validate reviewed press references
        run: |
          set -euo pipefail
          python scripts/check_reviewed_press_references.py

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail

          # git does not expand shell globs in pathspecs, so we filter with grep.
          changed_files="$(
            git diff --name-only HEAD \
              | grep -E '^(scripts/press-reviewed-links\.json|apps/[^/]+/public/(press-references/[^/]+\.json|data/press_references\.json))$' \
              || true
          )"

          if [ -z "${changed_files}" ]; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No new press references found."
            exit 0
          fi

          echo "has_changes=true" >> "${GITHUB_OUTPUT}"

          changed_apps="$(
            printf '%s\n' "${changed_files}" \
              | awk -F/ '/^apps\/[^/]+\/public\// { print $2 }' \
              | sort -u | paste -sd, -
          )"
          echo "changed_apps=${changed_apps}" >> "${GITHUB_OUTPUT}"

          new_count="$(
            git diff HEAD -- scripts/press-reviewed-links.json \
              | grep '^+.*"id":' | wc -l | tr -d ' '
          )"
          echo "new_count=${new_count}" >> "${GITHUB_OUTPUT}"

          echo "Changed apps: ${changed_apps}"
          echo "New press references: ${new_count}"

      - name: Create pull request
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/press-review-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(press): add AI-reviewed press references (auto)"
          title: "Persberichten review — ${{ steps.detect.outputs.new_count }} nieuwe links [keyword]"
          add-paths: |
            scripts/press-reviewed-links.json
            apps/*/public/press-references/*.json
            apps/*/public/data/press_references.json
          body: |
            ## Maandelijkse persberichten-review

            Dit PR is automatisch aangemaakt op basis van nieuwe persberichten in **emv-pers**.
            Kernwoordregels uit `press-blog-profiles.json` bepaalden welke apps relevant zijn.

            **Gewijzigde apps:** `${{ steps.detect.outputs.changed_apps }}`
            **Nieuwe referenties:** ${{ steps.detect.outputs.new_count }}

            ### Review checklist
            - [ ] Controleer `scripts/press-reviewed-links.json` — zijn de matches logisch?
            - [ ] Spot-check 2-3 per-app `press_references.json` bestanden
            - [ ] Pas eventueel `matched_slugs` of `notes` aan voor fout-positieven

            Merge als de matches correct zijn. Sluit het PR als alle voorstellen fout zijn.

            ---
            _Gegenereerd door `monthly-press-review.yml` · run `${{ github.run_id }}`_
          labels: "automated,press-review"
          draft: false

      - name: No changes summary
        if: steps.detect.outputs.has_changes != 'true'
        run: |
          echo "✓ No new relevant press releases found this month."
