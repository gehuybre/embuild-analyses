name: Update starters-stoppers data

concurrency:
  group: update-starters-stoppers-data
  cancel-in-progress: true

on:
  schedule:
    - cron: "35 5 25 * *"
  workflow_dispatch: {}
  push:
    paths:
      - apps/starters-stoppers/data/**
      - apps/starters-stoppers/scripts/**
      - apps/starters-stoppers/src/app/page.tsx
      - .github/workflows/update-starters-stoppers-data.yml
      - scripts/update_analysis_data_status.py
      - scripts/update_publication_date.py

permissions:
  actions: write
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: starters-stoppers
      APP_ROOT: apps/starters-stoppers
      PUBLICATION_PAGE_URL: https://statbel.fgov.be/nl/themas/ondernemingen/btw-plichtige-ondernemingen/maandevolutie-van-de-btw-plichtige-ondernemingen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xlrd beautifulsoup4

      - name: Refresh monthly starters-stoppers data
        run: python "${APP_ROOT}/scripts/process_monthly_data.py"

      - name: Verify generated outputs
        run: |
          set -euo pipefail
          test -f "${APP_ROOT}/public/data/vat_monthly_flows.json"
          test -f "${APP_ROOT}/public/data/vat_monthly_flows_regions.json"
          test -f "${APP_ROOT}/public/data/vat_monthly_lookups.json"
          test -f "${APP_ROOT}/public/data/vat_yearly_flows.json"
          test -f "${APP_ROOT}/public/data/summary.json"
          test -f "${APP_ROOT}/data/.remote_metadata.json"

      - name: Sync visible metadata
        run: |
          set -euo pipefail
          python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"
          python scripts/update_publication_date.py "${ANALYSIS_SLUG}" "${PUBLICATION_PAGE_URL}"

      - name: Commit and push changes
        id: commit_changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_ROOT}/data/.remote_metadata.json"
          git add "${APP_ROOT}/public/data/"
          git add "${APP_ROOT}/src/app/page.tsx"

          if [ -f "${APP_ROOT}/content.mdx" ]; then
            git add "${APP_ROOT}/content.mdx"
          fi

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update starters-stoppers data (auto)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
