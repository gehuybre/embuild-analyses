name: Update vergunningen-aanvragen data

concurrency:
  group: update-vergunningen-aanvragen-data
  cancel-in-progress: true

on:
  schedule:
    - cron: "10 1 1 * *"
  workflow_dispatch: {}
  push:
    paths:
      - apps/vergunningen-aanvragen/data/**
      - apps/vergunningen-aanvragen/scripts/**
      - scripts/update_analysis_data_status.py

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: vergunningen-aanvragen
      APP_ROOT: apps/vergunningen-aanvragen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Verify source files
        run: |
          set -euo pipefail
          test -f "${APP_ROOT}/data/bouwen_of_verbouwen_van_woningen.csv"
          test -f "${APP_ROOT}/data/Kopie van bouwstatistieken_met type aanvrager_2026.csv"

      - name: Run data processor
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify generated outputs
        run: |
          set -euo pipefail
          for f in \
            nieuwbouw_quarterly.json \
            nieuwbouw_yearly.json \
            nieuwbouw_by_type.json \
            verbouw_quarterly.json \
            verbouw_yearly.json \
            verbouw_by_type.json \
            sloop_quarterly.json \
            sloop_yearly.json \
            sloop_by_besluit.json \
            aanvrager_yearly.json \
            lookups.json
          do
            test -f "${APP_ROOT}/public/data/${f}" || { echo "Missing ${f}"; exit 1; }
          done

      - name: Sync visible metadata
        run: python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"

      - name: Commit and push changes
        id: commit_changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_ROOT}/public/data/"

          if [ -f "${APP_ROOT}/content.mdx" ]; then
            git add "${APP_ROOT}/content.mdx"
          fi

          if [ -f "${APP_ROOT}/src/app/page.tsx" ]; then
            git add "${APP_ROOT}/src/app/page.tsx"
          fi

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update vergunningen-aanvragen data (auto)"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
