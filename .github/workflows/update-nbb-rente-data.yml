name: Update nbb-rente data

concurrency:
  group: update-nbb-rente-data
  cancel-in-progress: true

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: nbb-rente
      APP_ROOT: apps/nbb-rente
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh NBB rente data
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify expected output files
        run: |
          set -euo pipefail
          test -f "${APP_ROOT}/public/data/interest_rates.json"
          test -f "${APP_ROOT}/public/data/interest_rates.csv"
          test -f "${APP_ROOT}/public/data/metadata.json"
          test -f "${APP_ROOT}/public/data/inflation_forecasts.json"
          test -f "${APP_ROOT}/public/data/inflation_forecasts.csv"
          test -f "${APP_ROOT}/public/data/inflation_forecasts_metadata.json"
          test -f "${APP_ROOT}/data/.remote_metadata.json"

      - name: Sync visible metadata
        run: python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"

      - name: Commit and push changes
        id: commit_changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_ROOT}/data/.remote_metadata.json"
          git add "${APP_ROOT}/content.mdx"
          git add "${APP_ROOT}/src/app/page.tsx"
          git add "${APP_ROOT}/public/data/"

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update nbb-rente data (auto)"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
