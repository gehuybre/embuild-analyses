name: Update nbb-rente data

concurrency:
  group: update-nbb-rente-data
  cancel-in-progress: true

on:
  schedule:
    - cron: "15 4 1 * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: nbb-rente
      APP_ROOT: apps/nbb-rente
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh NBB rente data
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify expected output files
        run: |
          set -euo pipefail
          for f in \
            interest_rates.json \
            interest_rates.csv \
            metadata.json \
            inflation_forecasts.json \
            inflation_forecasts.csv \
            inflation_forecasts_metadata.json
          do
            test -f "${APP_ROOT}/public/data/${f}" || { echo "Missing ${f}"; exit 1; }
          done
          test -f "${APP_ROOT}/data/.remote_metadata.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          app_root = Path(os.environ["APP_ROOT"])
          data_dir = app_root / "public" / "data"

          def load_json(path):
              with path.open(encoding="utf-8") as handle:
                  return json.load(handle)

          def fail(message):
              raise SystemExit(message)

          interest = load_json(data_dir / "interest_rates.json")
          interest_meta = load_json(data_dir / "metadata.json")
          if not isinstance(interest, list) or len(interest) < 100:
              fail("interest_rates.json has too few observations")
          if len({row["period"] for row in interest}) != len(interest):
              fail("interest_rates.json contains duplicate periods")
          if interest != sorted(interest, key=lambda row: int(row["sortValue"])):
              fail("interest_rates.json is not sorted by sortValue")

          latest_interest = interest[-1]
          if interest_meta.get("latestPeriod") != latest_interest.get("period"):
              fail("metadata latestPeriod does not match interest_rates.json")
          if interest_meta.get("observationCount") != len(interest):
              fail("metadata observationCount does not match interest_rates.json")
          if abs(float(interest_meta.get("latestRate")) - float(latest_interest.get("rate"))) > 1e-9:
              fail("metadata latestRate does not match interest_rates.json")

          forecasts = load_json(data_dir / "inflation_forecasts.json")
          forecast_meta = load_json(data_dir / "inflation_forecasts_metadata.json")
          if not isinstance(forecasts, list) or len(forecasts) < 3:
              fail("inflation_forecasts.json has too few forecast vintages")
          if len({row["forecastMonth"] for row in forecasts}) != len(forecasts):
              fail("inflation_forecasts.json contains duplicate forecast months")
          if forecasts != sorted(forecasts, key=lambda row: int(row["forecastSortValue"])):
              fail("inflation_forecasts.json is not sorted by forecastSortValue")

          latest_forecast = forecasts[-1]
          if forecast_meta.get("latestForecastMonth") != latest_forecast.get("forecastMonth"):
              fail("forecast metadata latestForecastMonth does not match inflation_forecasts.json")
          if forecast_meta.get("forecastCount") != len(forecasts):
              fail("forecast metadata forecastCount does not match inflation_forecasts.json")
          if not latest_forecast.get("monthlyPoints"):
              fail("latest inflation forecast has no monthly points")
          PY

      - name: Sync visible metadata
        run: python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"

      - name: Commit and push changes
        id: commit_changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_ROOT}/data/.remote_metadata.json"
          if [ -f "${APP_ROOT}/content.mdx" ]; then
            git add "${APP_ROOT}/content.mdx"
          fi
          git add "${APP_ROOT}/src/app/page.tsx"
          git add "${APP_ROOT}/public/data/"

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update nbb-rente data (auto)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
