name: Update fin-indicatoren data

concurrency:
  group: update-fin-indicatoren-data
  cancel-in-progress: true

on:
  schedule:
    - cron: "15 5 1 * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: fin-indicatoren
      APP_ROOT: apps/fin-indicatoren
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests matplotlib

      - name: Refresh NBB financial indicator data
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify generated outputs
        run: |
          set -euo pipefail
          test -f "${APP_ROOT}/data/.remote_metadata.json"
          test -f "${APP_ROOT}/public/data/article.json"
          test -f "${APP_ROOT}/public/data/metadata.json"
          test -f "${APP_ROOT}/public/data/cbratiose_bouw_vs_alle_sectoren_comparison.csv"
          test -f "${APP_ROOT}/public/data/cbratiose_bouw_vs_alle_sectoren_long.csv"
          test -f "${APP_ROOT}/public/data/cbratiose_bouw_vs_andere_sectoren_long.csv"
          test -f "${APP_ROOT}/public/data/cbratiose_bouwsubsectoren_long.csv"
          test -f "${APP_ROOT}/public/data/images/bouwsector-stoplicht.png"

      - name: Sync visible metadata
        run: python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"

      - name: Commit and push changes
        id: commit_changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${APP_ROOT}/data/.remote_metadata.json"
          git add "${APP_ROOT}/content.mdx"
          git add "${APP_ROOT}/src/app/page.tsx"
          git add "${APP_ROOT}/public/data/"

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update fin-indicatoren data (auto)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
