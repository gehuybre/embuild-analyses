name: Deploy analyses to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "embuild-analyses/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "CLOUDFLARE_PAGES.md"
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
      NEXT_PUBLIC_DATA_BASE_URL: ${{ vars.NEXT_PUBLIC_DATA_BASE_URL }}
      NEXT_PUBLIC_DEPLOY_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository configuration
        run: |
          if [ -z "${CLOUDFLARE_PAGES_PROJECT}" ]; then
            echo "::error::Missing repository variable CLOUDFLARE_PAGES_PROJECT."
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_DATA_BASE_URL}" ]; then
            echo "::warning::NEXT_PUBLIC_DATA_BASE_URL is empty. Production will fall back to same-origin /data paths."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: embuild-analyses/package-lock.json

      - name: Install dependencies
        working-directory: embuild-analyses
        run: npm ci --legacy-peer-deps

      - name: Build static export
        working-directory: embuild-analyses
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy embuild-analyses/out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
