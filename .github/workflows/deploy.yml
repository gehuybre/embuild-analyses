name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/build-apps.mjs"
      - "scripts/build-standalone-app.mjs"
      - "scripts/build-standalone-apps.mjs"
      - "scripts/app-registry.mjs"
      - "scripts/detect-changed-apps.mjs"
      - "scripts/shared-dependents.mjs"
      - "scripts/merge-outputs.mjs"
      - "scripts/generate-portal-data.mjs"
      - "scripts/analysis-versions.json"
      - "scripts/site-apps.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Optional app slug, comma-separated slugs, or JSON array to rebuild"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      all_apps: ${{ steps.detect.outputs.all_apps }}
      all_standalone_apps: ${{ steps.detect.outputs.all_standalone_apps }}
      changed_apps: ${{ steps.detect.outputs.changed_apps }}
      changed_standalone_apps: ${{ steps.detect.outputs.changed_standalone_apps }}
      changed_count: ${{ steps.detect.outputs.changed_count }}
      changed_standalone_count: ${{ steps.detect.outputs.changed_standalone_count }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "${GITHUB_SHA}"

      - name: Detect apps that need a rebuild
        id: detect
        run: |
          node scripts/detect-changed-apps.mjs \
            --event-name "${{ github.event_name }}" \
            --apps '${{ github.event.inputs.apps }}' \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --output "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEPLOY_VERSION: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=6144"
      NEXT_TELEMETRY_DISABLED: "1"
      BUILD_APPS_CONCURRENCY: "2"
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "${GITHUB_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install Python data dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas openpyxl

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate embed consistency
        run: node scripts/validate_embed_consistency.js

      - name: Log rebuild plan
        run: |
          echo "${{ needs.detect.outputs.reason }}"
          echo "Changed apps: ${{ needs.detect.outputs.changed_apps }}"

      - name: Restore previous app outputs
        id: app_outputs
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/**/out
            .app-outputs-revision
          key: app-outputs-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            app-outputs-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Check changes since the cached build
        id: cached_changes
        run: |
          set -euo pipefail
          base=""
          if [ -f .app-outputs-revision ]; then
            base="$(cat .app-outputs-revision)"
          fi
          node scripts/detect-changed-apps.mjs \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/cached-changes"
          cat "$RUNNER_TEMP/cached-changes" >> "$GITHUB_OUTPUT"

      - name: Build changed apps only
        run: node scripts/build-apps.mjs --apps-json '${{ needs.detect.outputs.changed_apps }}'

      - name: Rebuild other apps changed since the cached build
        env:
          REQUESTED_APPS: ${{ needs.detect.outputs.changed_apps }}
          CACHED_CHANGED_APPS: ${{ steps.cached_changes.outputs.changed_apps }}
        run: |
          apps="$(node --input-type=module -e '
            const requested = new Set(JSON.parse(process.env.REQUESTED_APPS));
            console.log(JSON.stringify(JSON.parse(process.env.CACHED_CHANGED_APPS).filter(app => !requested.has(app))));
          ')"
          node scripts/build-apps.mjs --apps-json "$apps"

      - name: Backfill missing app outputs from a cold cache
        run: node scripts/build-apps.mjs --apps-json '${{ needs.detect.outputs.all_apps }}' --missing-out-only

      - name: Merge outputs
        run: node scripts/merge-outputs.mjs

      - name: Record app output revision
        run: printf '%s\n' "$GITHUB_SHA" > .app-outputs-revision

      - name: Save app outputs for the next deploy
        if: steps.app_outputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/**/out
            .app-outputs-revision
          key: ${{ steps.app_outputs.outputs.cache-primary-key }}

      - name: Remove files exceeding CF Pages 25MB limit
        run: |
          find dist -size +25M -print -delete

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Standalone builds are only published as an artifact, so they run in parallel
  # with the site build and never delay the Cloudflare deploy.
  standalone:
    needs: detect
    if: needs.detect.outputs.changed_standalone_count != '0'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEPLOY_VERSION: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=6144"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune --no-tags origin "+refs/heads/*:refs/remotes/origin/*"
          git checkout --force "${GITHUB_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install Python data dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas openpyxl

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone versions for changed analyses
        run: node scripts/build-standalone-apps.mjs --apps-json '${{ needs.detect.outputs.changed_standalone_apps }}'

      - name: Upload standalone builds with Cloudflare README files
        uses: actions/upload-artifact@v4
        with:
          name: dist-standalone
          path: dist-standalone/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        run: |
          missing=0
          if [ -z "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" ]; then
            echo "::error::Missing repository variable CLOUDFLARE_PAGES_PROJECT"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::Set missing values at https://github.com/${{ github.repository }}/settings"
            exit 1
          fi
          echo "✓ All Cloudflare configuration present"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.79.0 pages deploy dist --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
