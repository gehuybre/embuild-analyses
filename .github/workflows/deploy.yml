name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/build-apps.mjs"
      - "scripts/detect-changed-apps.mjs"
      - "scripts/merge-outputs.mjs"
      - "scripts/generate-portal-data.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Optional app slug, comma-separated slugs, or JSON array to rebuild"
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      all_apps: ${{ steps.detect.outputs.all_apps }}
      changed_apps: ${{ steps.detect.outputs.changed_apps }}
      changed_count: ${{ steps.detect.outputs.changed_count }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect apps that need a rebuild
        id: detect
        run: |
          node scripts/detect-changed-apps.mjs \
            --event-name "${{ github.event_name }}" \
            --apps '${{ github.event.inputs.apps }}' \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --output "$GITHUB_OUTPUT"

  build:
    needs: detect
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DEPLOY_VERSION: ${{ github.sha }}
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Restore cached app outputs
        uses: actions/cache/restore@v4
        with:
          path: apps/**/out
          key: app-outs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            app-outs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
            app-outs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log rebuild plan
        run: |
          echo "${{ needs.detect.outputs.reason }}"
          echo "Changed apps: ${{ needs.detect.outputs.changed_apps }}"

      - name: Build changed apps only
        run: node scripts/build-apps.mjs --apps-json '${{ needs.detect.outputs.changed_apps }}'

      - name: Backfill missing app outputs from a cold cache
        run: node scripts/build-apps.mjs --apps-json '${{ needs.detect.outputs.all_apps }}' --missing-out-only

      - name: Merge outputs
        run: node scripts/merge-outputs.mjs

      - name: Remove files exceeding CF Pages 25MB limit
        run: |
          find dist -size +25M -print -delete

      - name: Save updated app outputs cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: apps/**/out
          key: app-outs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Save Turborepo cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        run: |
          missing=0
          if [ -z "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" ]; then
            echo "::error::Missing repository variable CLOUDFLARE_PAGES_PROJECT"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::Set missing values at https://github.com/${{ github.repository }}/settings"
            exit 1
          fi
          echo "✓ All Cloudflare configuration present"

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
