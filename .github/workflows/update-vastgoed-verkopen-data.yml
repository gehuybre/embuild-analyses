name: Update vastgoed-verkopen data

concurrency:
  group: update-vastgoed-verkopen-data
  cancel-in-progress: true

on:
  schedule:
    - cron: "30 4 3 * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      ANALYSIS_SLUG: vastgoed-verkopen
      APP_ROOT: apps/vastgoed-verkopen
      META_FILE: apps/vastgoed-verkopen/data/.remote_metadata.json
      PUBLICATION_PAGE_URL: https://statbel.fgov.be/nl/themas/bouwen-wonen/vastgoedprijzen
      INPUT_URL: https://statbel.fgov.be/sites/default/files/files/documents/Bouwen%20%26%20wonen/2.1%20Vastgoedprijzen/NM/NL_immo_statbel_kwartaal_per_gemeente.xlsx
      STATBEL_SOURCE_MODE: document_exports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Check remote metadata
        id: check_remote
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "Event ${GITHUB_EVENT_NAME}: forcing refresh."
            exit 0
          fi

          mkdir -p "$(dirname "${META_FILE}")"
          headers="$(curl -sSI -L "${INPUT_URL}" || true)"
          export REMOTE_ETAG="$(printf '%s\n' "${headers}" | awk -F': ' '/^ETag:/ {print $2}' | tr -d '\r"')"
          export REMOTE_LASTMOD="$(printf '%s\n' "${headers}" | awk -F': ' '/^Last-Modified:/ {print substr($0,index($0,$2)) }' | tr -d '\r')"

          set +e
          python scripts/check_remote_metadata.py
          rc=$?
          set -e

          if [ "${rc}" -eq 2 ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No remote change detected; skipping."
            exit 0
          fi

          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 2 ]; then
            exit "${rc}"
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Refresh vastgoed-verkopen data
        if: steps.check_remote.outputs.changed == 'true'
        run: python "${APP_ROOT}/scripts/process_data.py"

      - name: Verify generated outputs
        if: steps.check_remote.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for f in \
            yearly.json \
            yearly.csv \
            quarterly.json \
            quarterly.csv \
            quarterly_chunk_0.json \
            municipalities.json \
            lookups.json \
            metadata.json
          do
            test -f "${APP_ROOT}/public/data/${f}" || { echo "Missing ${f}"; exit 1; }
          done
          test -f "${META_FILE}"

      - name: Sync visible metadata
        if: steps.check_remote.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python scripts/update_analysis_data_status.py "${ANALYSIS_SLUG}"
          python scripts/update_publication_date.py "${ANALYSIS_SLUG}" "${PUBLICATION_PAGE_URL}"

      - name: Commit and push changes
        id: commit_changes
        if: steps.check_remote.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${META_FILE}"
          git add "${APP_ROOT}/public/data/"

          if [ -f "${APP_ROOT}/src/app/page.tsx" ]; then
            git add "${APP_ROOT}/src/app/page.tsx"
          fi

          if [ -f "${APP_ROOT}/content.mdx" ]; then
            git add "${APP_ROOT}/content.mdx"
          fi

          if git diff --staged --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit"
          else
            git commit -m "chore(data): update vastgoed-verkopen data (auto)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:main
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger deploy
        if: steps.commit_changes.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}" -f apps="${ANALYSIS_SLUG}"
        env:
          GH_TOKEN: ${{ github.token }}
